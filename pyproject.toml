[project]
name = "AgenticPatternsLab"
version = "0.1.0"
description = "Agentic Patterns Lab"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

# --- Fixes the flat-layout discovery error ---
[tool.setuptools.packages.find]
include = ["AgenticPatternsLab*"]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["AgenticPatternsLab/patterns/react/pure_python"]