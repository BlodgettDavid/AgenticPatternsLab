[project]
name = "AgenticPatternsLab"
version = "0.1.0"
description = "Agentic Patterns Lab"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["AgenticPatternsLab/patterns/react/pure_python"]